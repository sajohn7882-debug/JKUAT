<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wayfinder AI Training</title>
  <style>
    :root { --ink: #17324d; --muted: #65798a; --paper: #f7f4ec; --card: #fffdf8; --blue: #087e8b; --gold: #f4b942; --line: #d9e1dc; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: Georgia, 'Times New Roman', serif; }
    header { padding: 20px clamp(16px, 4vw, 48px); color: white; background: var(--ink); border-bottom: 5px solid var(--gold); }
    header a { color: white; text-decoration: none; font: 700 .85rem Arial, sans-serif; }
    main { width: min(100% - 32px, 920px); margin: 28px auto 48px; }
    h1 { margin: 12px 0 6px; font-size: clamp(1.8rem, 4vw, 2.8rem); }
    .intro { margin: 0; color: #d8e3e6; font: .95rem/1.5 Arial, sans-serif; max-width: 680px; }
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, .75fr); gap: 18px; }
    .panel { padding: 22px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 30px rgba(23, 50, 77, .1); }
    h2 { margin: 0 0 14px; font-size: 1.3rem; }
    label { display: block; margin: 13px 0 6px; color: var(--muted); font: 700 .75rem Arial, sans-serif; text-transform: uppercase; letter-spacing: .06em; }
    input, textarea, select, button { width: 100%; border: 1px solid var(--line); border-radius: 7px; font: 16px Arial, sans-serif; }
    input, textarea, select { padding: 11px 12px; color: var(--ink); background: white; }
    textarea { min-height: 170px; resize: vertical; line-height: 1.45; }
    button { min-height: 44px; margin-top: 14px; padding: 0 14px; color: white; background: var(--blue); border-color: var(--blue); cursor: pointer; font-weight: 700; }
    button:hover { background: #075b67; }
    .notice { min-height: 22px; margin-top: 12px; color: var(--muted); font: .86rem/1.4 Arial, sans-serif; }
    .entry { padding: 13px 0; border-top: 1px solid var(--line); }
    .entry:first-child { border-top: 0; padding-top: 0; }
    .entry h3 { margin: 0 0 4px; font: 700 .98rem Arial, sans-serif; }
    .entry p { margin: 0; white-space: pre-wrap; color: var(--muted); font: .88rem/1.45 Arial, sans-serif; }
    .entry small { display: block; margin-top: 6px; color: var(--blue); font: .72rem Arial, sans-serif; }
    .entry button { width: auto; min-height: 32px; margin-top: 8px; color: var(--ink); background: white; border-color: var(--line); font-size: .78rem; }
    .empty { color: var(--muted); font: .88rem Arial, sans-serif; }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <a href="/">&larr; Back to Wayfinder</a>
    <h1>Train Wayfinder AI</h1>
    <p class="intro">Add trusted facts, policies, FAQs, course guidance, or local instructions. New notes are included in future AI answers.</p>
  </header>
  <main>
    <div class="grid">
      <section class="panel">
        <h2>Add knowledge</h2>
        <form id="training-form">
          <label for="training-key">Training key</label>
          <input id="training-key" type="password" autocomplete="off" required placeholder="AI_TRAINING_KEY">
          <label for="training-title">Title</label>
          <input id="training-title" required maxlength="120" placeholder="Example: Library opening policy">
          <label for="training-category">Category</label>
          <select id="training-category"><option>Campus</option><option>Learning</option><option>FAQ</option><option>Policy</option><option>General</option></select>
          <label for="training-content">Knowledge or answer guidance</label>
          <textarea id="training-content" required maxlength="12000" placeholder="Write the facts the assistant should know. Include dates and source context when relevant."></textarea>
          <button type="submit">Save training note</button>
        </form>
        <div id="notice" class="notice" role="status"></div>
      </section>
      <section class="panel">
        <h2>Saved knowledge</h2>
        <div id="entries"><p class="empty">Loading training notes...</p></div>
      </section>
    </div>
  </main>
  <script>
    const form = document.getElementById('training-form');
    const entries = document.getElementById('entries');
    const notice = document.getElementById('notice');
    const keyInput = document.getElementById('training-key');
    keyInput.value = sessionStorage.getItem('wayfinderTrainingKey') || '';
    function escapeHtml(value) { return String(value).replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[character]); }
    async function loadEntries() { const response = await fetch('/api/ai/knowledge'); const data = await response.json(); entries.innerHTML = data.length ? data.slice().reverse().map((entry) => `<article class="entry"><h3>${escapeHtml(entry.title)}</h3><p>${escapeHtml(entry.content)}</p><small>${escapeHtml(entry.category)}</small><button type="button" data-id="${escapeHtml(entry.id)}">Delete</button></article>`).join('') : '<p class="empty">No training notes yet.</p>'; }
    form.addEventListener('submit', async (event) => { event.preventDefault(); const key = keyInput.value.trim(); sessionStorage.setItem('wayfinderTrainingKey', key); const response = await fetch('/api/ai/knowledge', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-ai-training-key': key }, body: JSON.stringify({ title: document.getElementById('training-title').value, category: document.getElementById('training-category').value, content: document.getElementById('training-content').value }) }); const data = await response.json(); notice.textContent = response.ok ? 'Training note saved.' : (data.error || 'Unable to save training note.'); if (response.ok) { document.getElementById('training-title').value = ''; document.getElementById('training-content').value = ''; await loadEntries(); } });
    entries.addEventListener('click', async (event) => { if (!event.target.dataset.id) return; const response = await fetch(`/api/ai/knowledge/${event.target.dataset.id}`, { method: 'DELETE', headers: { 'x-ai-training-key': keyInput.value.trim() } }); notice.textContent = response.ok ? 'Training note deleted.' : 'Unable to delete training note.'; if (response.ok) await loadEntries(); });
    loadEntries().catch(() => { entries.innerHTML = '<p class="empty">Unable to load training notes.</p>'; });
  </script>
</body>
</html>
